<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="todo-card">

            <header>
                <h1>My To-Do List</h1>
                <p>Stay organized. Get things done.</p>
            </header>

            <!-- Add Task -->
            <form id="todoForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

                <button type="submit" id="addBtn">
                    Add Task
                </button>
            </form>

            <!-- Filters -->
            <div class="toolbar">

                <span id="taskCount">
                    0 tasks remaining
                </span>

                <div class="filters">
                    <button type="button" class="filter active" data-filter="all">
                        All
                    </button>

                    <button type="button" class="filter" data-filter="active">
                        Active
                    </button>

                    <button type="button" class="filter" data-filter="completed">
                        Completed
                    </button>
                </div>

            </div>

            <!-- Task List -->
            <ul id="taskList"></ul>

            <!-- Bottom Actions -->
            <div class="bottom">
                <button id="clearCompleted">
                    Clear Completed
                </button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
